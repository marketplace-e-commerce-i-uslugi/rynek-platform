  notification-service:
    <<: *java
    image: ${REGISTRY:-ghcr.io/marketplace-e-commerce-i-uslugi}/rynek-notification-service:${TAG:-latest}
    build: { context: ./rynek-notification-service, dockerfile: ../docker/service.Dockerfile }
