  payment-service:
    <<: *java
    image: ${REGISTRY:-ghcr.io/marketplace-e-commerce-i-uslugi}/rynek-payment-service:${TAG:-latest}
    build: { context: ./rynek-payment-service, dockerfile: ../docker/service.Dockerfile }
