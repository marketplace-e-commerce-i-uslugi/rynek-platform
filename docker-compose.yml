      DB_PASSWORD: chats

  cart-service:
    <<: *java
    image: ${REGISTRY:-ghcr.io/marketplace-e-commerce-i-uslugi}/rynek-cart-service:${TAG:-latest}
    build: { context: ./rynek-cart-service, dockerfile: ../docker/service.Dockerfile }
    environment:
