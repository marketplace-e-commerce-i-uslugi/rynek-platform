  order-service:
    <<: *java
    image: ${REGISTRY:-ghcr.io/marketplace-e-commerce-i-uslugi}/rynek-order-service:${TAG:-latest}
    build: { context: ./rynek-order-service, dockerfile: ../docker/service.Dockerfile }
