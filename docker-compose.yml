      DB_USER: payments
      DB_PASSWORD: payments

  booking-service:
    <<: *java
    image: ${REGISTRY:-ghcr.io/marketplace-e-commerce-i-uslugi}/rynek-booking-service:${TAG:-latest}
    build: { context: ./rynek-booking-service, dockerfile: ../docker/service.Dockerfile }
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/bookings
      DB_USER: bookings
      DB_PASSWORD: bookings

  shipping-service:
    <<: *java
    image: ${REGISTRY:-ghcr.io/marketplace-e-commerce-i-uslugi}/rynek-shipping-service:${TAG:-latest}
    build: { context: ./rynek-shipping-service, dockerfile: ../docker/service.Dockerfile }
    environment:
      <<: *env
