; Procesy kontenera all-in-one. Każdy ma osobny log w /var/log/rynek (docker exec <kontener> tail -f /var/log/rynek/<nazwa>.log).
[supervisord]
nodaemon=true
user=root
logfile=/var/log/rynek/supervisord.log
pidfile=/run/supervisor/supervisord.pid

[unix_http_server]
file=/run/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

; ---------- infrastruktura ----------
[program:postgres]
command=/usr/local/pgbin/postgres -D /data/postgres -c listen_addresses=127.0.0.1 -c max_connections=150 -c shared_buffers=48MB -c work_mem=2MB -c maintenance_work_mem=16MB -c synchronous_commit=off
user=postgres
priority=10
stopsignal=INT
stdout_logfile=/var/log/rynek/postgres.log
redirect_stderr=true

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --dir /data/redis --save "" --appendonly no --maxmemory 48mb --maxmemory-policy allkeys-lru
user=redis
priority=10
stdout_logfile=/var/log/rynek/redis.log
redirect_stderr=true

[program:seaweedfs]
; Porty wewnętrzne przesunięte, bo domyślny port woluminu (8080) zajmuje api-gateway.
command=/usr/local/bin/weed server -dir=/data/seaweed -ip=127.0.0.1 -ip.bind=0.0.0.0 -master.port=19333 -volume.port=18080 -filer.port=18888 -master.volumeSizeLimitMB=128 -volume.max=30 -s3 -s3.port=8333 -s3.config=/opt/rynek/s3.json
priority=10
stdout_logfile=/var/log/rynek/seaweedfs.log
redirect_stderr=true

[program:opensearch]
command=/opt/opensearch/bin/opensearch
user=opensearch
environment=OPENSEARCH_JAVA_HOME="/opt/opensearch/jdk",JAVA_HOME="/opt/opensearch/jdk",OPENSEARCH_JAVA_OPTS="-Xms192m -Xmx192m",OPENSEARCH_PATH_CONF="/opt/opensearch/config"
priority=10
stdout_logfile=/var/log/rynek/opensearch.log
redirect_stderr=true

; ---------- serwisy (start rozłożony w czasie) ----------
[program:api-gateway]
command=/opt/rynek/start-service.sh api-gateway 0
priority=20
startsecs=40
startretries=30
autorestart=true
stdout_logfile=/var/log/rynek/api-gateway.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
redirect_stderr=true

